<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <style>
    /* ভাষা পরিবর্তনের বাটনের স্টাইল (আপনার পছন্দমতো পরিবর্তন করতে পারেন) */
    .lang-switcher-btn {
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- ভাষা পরিবর্তনের বাটন -->
  <button type="button" class="lang-switcher-btn" onclick="toggleLanguage()" id="lang-btn">English</button>

  <!-- আরবি কন্টেন্ট (শুরুতে পেজে এটি দেখাবে) -->
  <div id="arabic-content" dir="rtl">
    
    <!-- এখানে আপনার পুরো আরবি সাইটের এইচটিএমএল কোডগুলো বসিয়ে দিন -->
    <h2>مرحبا بك في موقعنا</h2>
    <p>هذا هو النص باللغة العربية...</p>

  </div>

  <!-- ইংরেজি কন্টেন্ট (শুরুতে এটি লুকানো থাকবে) -->
  <div id="english-content" dir="ltr" style="display: none;">
    
    <!-- এখানে আপনার পুরো ইংরেজি সাইটের এইচটিএমএল কোডগুলো বসিয়ে দিন -->
    <h2>Welcome to our website</h2>
    <p>This is the content in English...</p>

  </div>

  <!-- ভাষা অদলবদল করার জাভাস্ক্রিপ্ট কোড -->
  <script>
    function toggleLanguage() {
      var ar = document.getElementById('arabic-content');
      var en = document.getElementById('english-content');
      var btn = document.getElementById('lang-btn');

      if (ar.style.display === "none") {
        ar.style.display = "block";
        en.style.display = "none";
        btn.innerText = "English";
      } else {
        ar.style.display = "none";
        en.style.display = "block";
        btn.innerText = "عربي";
      }
    }
  </script>

</body>
</html>
